[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ng12-medical-rag"
version = "0.1.0"
description = "Recommendation-aware ingestion and hybrid retrieval for NICE NG12 (April 2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mahmoud Balash" }]
dependencies = [
  "faiss-cpu>=1.8,<2",
  "numpy>=1.26,<3",
  "openai>=1.50,<3",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "PyYAML>=6,<7",
  "rank-bm25>=0.2,<0.3",
  "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
ng12-rag = "ng12_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ng12_rag"]
mypy_path = "src"
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/ng12_rag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
